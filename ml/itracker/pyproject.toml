[project]
name = "eye-tracker-itracker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av==16.0.1",
    "mediapipe==1.2.0",
    "numpy==2.5.4",
    "opencv-contrib-python==4.14.0.94",
    "pydantic==2.12.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
