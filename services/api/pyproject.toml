[project]
name = "eye-tracker-api"
version = "0.1.0"
description = "API mínima para a base de coleta e processamento de olhar."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1",
    "pytest>=8.3.5,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
