services:
  api:
    build: &api-build
      context: .
      dockerfile: services/api/Dockerfile
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - experiment_data:/data
      - gaze_models:/models:ro
    depends_on:
      models:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2); assert json.load(response)['status'] == 'ok'"
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  models:
    build: *api-build
    init: true
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - gaze_models:/models
    command: ["python", "/opt/pipeline/model_assets.py", "--models", "/models"]

  web:
    build:
      context: ./apps/web
      target: runtime
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  experiment_data:
  gaze_models:
