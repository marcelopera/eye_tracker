name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Run API tests in Docker
        run: docker build -f services/api/Dockerfile --target test -t eye-tracker-api-test .
      - uses: astral-sh/setup-uv@v7
      - name: Test video pipeline
        run: uv run --directory ml/itracker --frozen --group dev python -m pytest
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Check public routes
        run: |
          curl --fail --silent --show-error http://localhost:8080/
          curl --fail --silent --show-error http://localhost:8080/api/health
          curl --fail --silent --show-error http://localhost:8080/api/info
          curl --fail --silent --show-error http://localhost:8080/api/experiments
          curl --fail --silent --show-error http://localhost:8080/openapi.json
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, and lint
        working-directory: apps/android
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
