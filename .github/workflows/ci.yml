name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, and lint
        working-directory: apps/android
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
